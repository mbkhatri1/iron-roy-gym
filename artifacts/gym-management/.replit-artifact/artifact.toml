kind = "web"
previewPath = "/"
title = "Gym Management Platform"
description = "A professional multi-tenant gym management platform for owners and staff to manage members, memberships, attendance, payments, trainers, expenses, reports, and daily operations."
version = "1.0.0"
id = "artifacts/gym-management"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24596

[services.development]
run = "corepack pnpm --filter @workspace/gym-management run dev"

[services.production]
build = [ "corepack", "pnpm", "--filter", "@workspace/gym-management", "run", "build" ]
serve = "static"
publicDir = "artifacts/gym-management/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24596"
BASE_PATH = "/"